name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Siapkan folder dist
        run: |
          mkdir -p dist
          # Cari file .html terbaru yang diubah di repo (selain README)
          LATEST_HTML=$(ls -t *.html 2>/dev/null | head -n 1)
          if [ -z "$LATEST_HTML" ]; then
            echo "Tidak ada file .html ditemukan di root repo!"
            exit 1
          fi
          echo "Menggunakan file: $LATEST_HTML"
          cp "$LATEST_HTML" dist/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
