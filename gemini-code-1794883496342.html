<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Telemetri Mobil RC</title>
    <style>
        :root {
            --bg-color: #181416;
            --card-bg: #241e21;
            --card-border: #3a2d33;
            --text-light: #FFF0F5;
            --text-muted: #C4A7B3;
            --pink-main: #FF69B4;
            --pink-light: #3b2b32;
            --pink-dark: #FF85C1;
            --safe-color: #2ED573;
            --warn-color: #FFA502;
            --danger-color: #FF4757;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-light);
            margin: 0;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: var(--pink-dark);
            margin: 0 0 6px 0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: 1.8em;
        }

        .header p {
            color: var(--text-muted);
            margin: 0 0 14px 0;
            font-weight: 500;
        }

        .status-bar {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .connection-status {
            display: inline-block;
            padding: 6px 16px;
            background-color: var(--warn-color);
            color: #181416;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        .last-update {
            font-size: 0.82em;
            color: var(--text-muted);
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 6px 14px;
            border-radius: 20px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 22px;
            width: 100%;
            max-width: 1040px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 24px 18px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
            text-align: center;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--pink-main);
            box-shadow: 0 14px 30px rgba(255, 105, 180, 0.2);
        }

        .card h3 {
            margin: 0 0 16px 0;
            color: var(--pink-dark);
            font-size: 1.1em;
            letter-spacing: 0.4px;
        }

        /* Desain Indikator Melingkar (SVG) */
        .circular-chart {
            display: block;
            margin: 0 auto;
            max-width: 175px;
            max-height: 175px;
        }

        .circle-bg {
            fill: none;
            stroke: var(--pink-light);
            stroke-width: 3.6;
        }

        .circle {
            fill: none;
            stroke-width: 3.2;
            stroke-linecap: round;
            transition: stroke-dasharray 0.6s ease-out, stroke 0.3s ease;
        }

        /* Warna spesifik tiap sensor */
        .color-temp { stroke: #FF7675; }
        .color-hum  { stroke: #74B9FF; }
        .color-gas  { stroke: var(--pink-main); }
        .color-dist { stroke: #A29BFE; }

        .percentage {
            fill: var(--text-light);
            font-family: 'Segoe UI', sans-serif;
            font-size: 0.46em;
            text-anchor: middle;
            font-weight: bold;
        }

        .sensor-label {
            fill: var(--text-muted);
            font-family: 'Segoe UI', sans-serif;
            font-size: 0.19em;
            text-anchor: middle;
            font-weight: 500;
        }

        .status-badge {
            display: inline-block;
            margin-top: 16px;
            padding: 6px 15px;
            border-radius: 15px;
            font-size: 0.85em;
            font-weight: bold;
            color: #181416;
            background-color: var(--safe-color);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .status-warning {
            background-color: var(--warn-color);
            color: #181416;
        }

        .status-danger {
            background-color: var(--danger-color);
            color: #FFFFFF;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%   { transform: scale(1); }
            50%  { transform: scale(1.06); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Dashboard RC Car</h1>
        <p>IoT Telemetry Monitor &bull; ESP32</p>
        <div class="status-bar">
            <div id="conn-status" class="connection-status">Menghubungkan ke Firebase...</div>
            <div id="last-update" class="last-update">Menunggu data...</div>
        </div>
    </div>

    <div class="grid-container">
        <!-- Sensor Suhu (DHT22) -->
        <div class="card">
            <h3>Suhu Lingkungan</h3>
            <svg viewBox="0 0 36 36" class="circular-chart">
                <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                <path class="circle color-temp" id="circle-temp" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                <text x="18" y="18.5" class="percentage" id="val-temp">0</text>
                <text x="18" y="24" class="sensor-label">&deg;C</text>
            </svg>
            <div id="status-temp" class="status-badge">Suhu Aman</div>
        </div>

        <!-- Sensor Kelembapan (DHT22) -->
        <div class="card">
            <h3>Kelembapan Udara</h3>
            <svg viewBox="0 0 36 36" class="circular-chart">
                <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                <path class="circle color-hum" id="circle-hum" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                <text x="18" y="18.5" class="percentage" id="val-hum">0</text>
                <text x="18" y="24" class="sensor-label">%</text>
            </svg>
            <div id="status-hum" class="status-badge">Normal</div>
        </div>

        <!-- Sensor Gas (MQ-2) -->
        <div class="card">
            <h3>Kadar Gas / Asap (MQ-2)</h3>
            <svg viewBox="0 0 36 36" class="circular-chart">
                <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                <path class="circle color-gas" id="circle-gas" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                <text x="18" y="18.5" class="percentage" id="val-gas">0</text>
                <text x="18" y="24" class="sensor-label">Raw ADC</text>
            </svg>
            <div id="status-gas" class="status-badge">Udara Bersih</div>
        </div>

        <!-- Sensor Jarak (HC-SR04) -->
        <div class="card">
            <h3>Jarak Rintangan</h3>
            <svg viewBox="0 0 36 36" class="circular-chart">
                <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                <path class="circle color-dist" id="circle-dist" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                <text x="18" y="18.5" class="percentage" id="val-dist">0</text>
                <text x="18" y="24" class="sensor-label">CM</text>
            </svg>
            <div id="status-dist" class="status-badge">Jalan Aman</div>
        </div>
    </div>

    <script>
        // Konfigurasi Firebase Realtime Database
        const FIREBASE_URL = "https://rc-telementri-default-rtdb.asia-southeast1.firebasedatabase.app";
        const FIREBASE_AUTH = "y4KdPtOZOokvMWl8qdZuSUpeOla0NAXgQsOW5a02";
        const DB_PATH = "/monitoring.json";

        const streamUrl = `${FIREBASE_URL}${DB_PATH}?auth=${FIREBASE_AUTH}`;

        // State data sensor
        let sensorData = { suhu: 0, kelembapan: 0, gas: 0, jarak: 0 };
        let hasReceivedData = false;

        const statusText = document.getElementById('conn-status');
        const lastUpdateText = document.getElementById('last-update');
        const eventSource = new EventSource(streamUrl);

        eventSource.onopen = () => {
            statusText.textContent = "Terhubung Real-Time";
            statusText.style.backgroundColor = "#2ED573";
            statusText.style.color = "#181416";
        };

        eventSource.onerror = (err) => {
            console.error("EventSource error:", err);
            statusText.textContent = "Koneksi Terputus / Mencoba Ulang...";
            statusText.style.backgroundColor = "#FF4757";
            statusText.style.color = "#FFFFFF";
        };

        eventSource.addEventListener('put', handleFirebaseData);
        eventSource.addEventListener('patch', handleFirebaseData);

        function handleFirebaseData(event) {
            if (!event.data || event.data === "null") return;

            try {
                const payload = JSON.parse(event.data);
                if (!payload || payload.data === undefined) return;

                if (payload.path === "/") {
                    if (payload.data && typeof payload.data === "object") {
                        sensorData = { ...sensorData, ...payload.data };
                        hasReceivedData = true;
                    }
                } else {
                    const key = payload.path.replace(/^\//, "");
                    if (key in sensorData) {
                        sensorData[key] = payload.data;
                        hasReceivedData = true;
                    }
                }

                const now = new Date().toLocaleTimeString('id-ID');
                lastUpdateText.textContent = `Update: ${now}`;
                updateDashboard();
            } catch (error) {
                console.error("Gagal mem-parsing data Firebase:", error);
            }
        }

        // Fungsi pembaruan Indikator Visual (Gauges)
        function updateGauge(idPrefix, rawValue, min, max) {
            const value = Number(rawValue);
            const safeValue = Number.isFinite(value) ? value : 0;

            let percentage = ((safeValue - min) / (max - min)) * 100;
            percentage = Math.min(100, Math.max(0, percentage));

            const circle = document.getElementById(`circle-${idPrefix}`);
            const textVal = document.getElementById(`val-${idPrefix}`);

            if (circle && textVal) {
                circle.setAttribute('stroke-dasharray', `${percentage.toFixed(1)}, 100`);
                textVal.textContent = Number.isInteger(safeValue)
                    ? safeValue
                    : safeValue.toFixed(1);
            }

            return safeValue;
        }

        // Fungsi evaluasi status sensor
        function updateDashboard() {
            // 1. DHT22 Suhu (0 - 50 °C)
            const suhu = updateGauge('temp', sensorData.suhu, 0, 50);
            const badgeTemp = document.getElementById('status-temp');
            if (suhu > 35) {
                badgeTemp.textContent = "Overheat!";
                badgeTemp.className = "status-badge status-danger";
            } else {
                badgeTemp.textContent = "Suhu Aman";
                badgeTemp.className = "status-badge";
            }

            // 2. DHT22 Kelembapan (0 - 100 %)
            const hum = updateGauge('hum', sensorData.kelembapan, 0, 100);
            const badgeHum = document.getElementById('status-hum');
            if (hum > 80) {
                badgeHum.textContent = "Terlalu Lembap";
                badgeHum.className = "status-badge status-warning";
            } else if (hum < 30 && hasReceivedData) {
                badgeHum.textContent = "Udara Kering";
                badgeHum.className = "status-badge status-warning";
            } else {
                badgeHum.textContent = "Normal";
                badgeHum.className = "status-badge";
            }

            // 3. MQ-2 Gas / Asap (ADC ESP32: 0 - 4095)
            const gas = updateGauge('gas', sensorData.gas, 0, 4095);
            const badgeGas = document.getElementById('status-gas');
            if (gas > 1500) {
                badgeGas.textContent = "Deteksi Gas / Asap!";
                badgeGas.className = "status-badge status-danger";
            } else {
                badgeGas.textContent = "Udara Bersih";
                badgeGas.className = "status-badge";
            }

            // 4. HC-SR04 Jarak Rintangan (0 - 200 CM)
            const jarak = updateGauge('dist', sensorData.jarak, 0, 200);
            const badgeDist = document.getElementById('status-dist');
            if (hasReceivedData && jarak < 15) {
                badgeDist.textContent = "Awas Tabrakan!";
                badgeDist.className = "status-badge status-danger";
            } else {
                badgeDist.textContent = "Jalan Aman";
                badgeDist.className = "status-badge";
            }
        }

        // Tutup koneksi stream saat tab ditutup
        window.addEventListener('beforeunload', () => {
            eventSource.close();
        });
    </script>
</body>
</html>
