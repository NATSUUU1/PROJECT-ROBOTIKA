<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Telemetri Mobil RC • Tropical Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #eef8f2;
            --bg-mid: #dff2e7;
            --bg-bottom: #cde7d8;
            --card-bg: rgba(255, 255, 255, 0.78);
            --card-border: rgba(45, 106, 79, 0.16);
            --card-shadow: 0 14px 34px rgba(27, 67, 50, 0.08);
            --text-dark: #143627;
            --text-muted: #4b7361;
            --leaf-deep: #1b4332;
            --leaf-main: #2d6a4f;
            --leaf-fresh: #40916c;
            --leaf-mint: #74c69d;
            --track-ring: rgba(45, 106, 79, 0.12);
            --safe-bg: #d8f3dc;
            --safe-text: #1b4332;
            --warn-bg: #fef0c7;
            --warn-text: #92400e;
            --danger-bg: #fee2e2;
            --danger-text: #b91c1c;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(155deg, var(--bg-top) 0%, var(--bg-mid) 52%, var(--bg-bottom) 100%);
            font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
            color: var(--text-dark);
            margin: 0;
            padding: 32px 18px 48px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Efek Cahaya Matahari Pagi Tropis */
        .sunbeam-glow {
            position: fixed;
            top: -140px;
            right: -120px;
            width: 520px;
            height: 520px;
            background: radial-gradient(circle, rgba(253, 230, 138, 0.42) 0%, rgba(116, 198, 157, 0.12) 45%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* Dekorasi Dedaunan Sudut (Bergerak Lembut Tertiup Angin) */
        .foliage-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .leaf-decor {
            position: absolute;
            opacity: 0.22;
            transform-origin: bottom left;
            animation: tropicalBreeze 7s ease-in-out infinite alternate;
        }

        .leaf-top-left {
            top: -25px;
            left: -30px;
            width: 280px;
            transform-origin: top left;
            animation-duration: 8s;
        }

        .leaf-bottom-right {
            bottom: -35px;
            right: -25px;
            width: 320px;
            transform-origin: bottom right;
            animation-duration: 9.5s;
            animation-delay: -2s;
        }

        .leaf-bottom-left {
            bottom: -20px;
            left: -20px;
            width: 210px;
            opacity: 0.15;
            transform-origin: bottom left;
            animation-duration: 6.5s;
            animation-delay: -1s;
        }

        @keyframes tropicalBreeze {
            0%   { transform: rotate(-2deg) scale(1); }
            50%  { transform: rotate(2.5deg) scale(1.02); }
            100% { transform: rotate(-1deg) scale(0.99); }
        }

        /* Partikel Embun / Cahaya Hutan Melayang */
        .dew-particles span {
            position: fixed;
            bottom: -20px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.85), rgba(116, 198, 157, 0.35));
            pointer-events: none;
            z-index: 0;
            animation: floatDew 14s linear infinite;
        }

        .dew-particles span:nth-child(1) { left: 12%; width: 7px; height: 7px; animation-duration: 13s; animation-delay: 0s; }
        .dew-particles span:nth-child(2) { left: 28%; width: 11px; height: 11px; animation-duration: 17s; animation-delay: 3s; }
        .dew-particles span:nth-child(3) { left: 52%; width: 6px; height: 6px; animation-duration: 12s; animation-delay: 6s; }
        .dew-particles span:nth-child(4) { left: 74%; width: 10px; height: 10px; animation-duration: 16s; animation-delay: 2s; }
        .dew-particles span:nth-child(5) { left: 89%; width: 8px; height: 8px; animation-duration: 15s; animation-delay: 5s; }

        @keyframes floatDew {
            0% {
                transform: translateY(0) translateX(0) scale(0.8);
                opacity: 0;
            }
            20% { opacity: 0.75; }
            80% { opacity: 0.5; }
            100% {
                transform: translateY(-105vh) translateX(28px) scale(1.15);
                opacity: 0;
            }
        }

        /* Konten Utama */
        .main-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 34px;
            max-width: 680px;
        }

        .brand-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 14px;
            border-radius: 999px;
            background: rgba(45, 106, 79, 0.1);
            border: 1px solid rgba(45, 106, 79, 0.18);
            color: var(--leaf-main);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .header h1 {
            color: var(--leaf-deep);
            margin: 0 0 8px 0;
            font-size: clamp(1.65rem, 3vw, 2.25rem);
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .header p {
            color: var(--text-muted);
            margin: 0 0 18px 0;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .status-bar {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .connection-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 16px;
            background-color: var(--warn-bg);
            color: var(--warn-text);
            border: 1px solid rgba(217, 119, 6, 0.25);
            border-radius: 999px;
            font-size: 0.83rem;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(27, 67, 50, 0.05);
            transition: all 0.3s ease;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: currentColor;
            animation: blinkDot 1.6s infinite ease-in-out;
        }

        @keyframes blinkDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.75); }
        }

        .last-update {
            font-size: 0.83rem;
            color: var(--text-muted);
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            padding: 7px 15px;
            border-radius: 999px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .sim-btn {
            font-family: inherit;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--leaf-main);
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(45, 106, 79, 0.28);
            padding: 7px 15px;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .sim-btn:hover {
            background: var(--leaf-main);
            color: #ffffff;
        }

        .sim-btn.active {
            background: var(--leaf-deep);
            color: #d8f3dc;
            border-color: var(--leaf-deep);
        }

        /* Grid Kartu Sensor */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(238px, 1fr));
            gap: 22px;
            width: 100%;
        }

        .card {
            position: relative;
            background: var(--card-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 22px 20px 24px;
            box-shadow: var(--card-shadow);
            text-align: center;
            overflow: hidden;
            transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1),
                        box-shadow 0.3s ease,
                        border-color 0.3s ease;
        }

        .card:hover {
            transform: translateY(-6px);
            border-color: rgba(64, 145, 108, 0.45);
            box-shadow: 0 18px 38px rgba(27, 67, 50, 0.14);
        }

        /* Watermark Urats Daun Halus di Sudut Kartu */
        .card-leaf-watermark {
            position: absolute;
            bottom: -14px;
            right: -14px;
            width: 95px;
            height: 95px;
            opacity: 0.06;
            pointer-events: none;
            transition: transform 0.4s ease, opacity 0.4s ease;
        }

        .card:hover .card-leaf-watermark {
            transform: rotate(-8deg) scale(1.08);
            opacity: 0.11;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .card-title-group {
            display: flex;
            align-items: center;
            gap: 8px;
            text-align: left;
        }

        .sensor-icon {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            background: rgba(64, 145, 108, 0.12);
            color: var(--leaf-main);
            flex-shrink: 0;
        }

        .card h3 {
            margin: 0;
            color: var(--leaf-deep);
            font-size: 0.98rem;
            font-weight: 700;
            line-height: 1.25;
        }

        .sensor-chip {
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--text-muted);
            background: rgba(45, 106, 79, 0.08);
            padding: 3px 8px;
            border-radius: 8px;
            letter-spacing: 0.3px;
        }

        /* Indikator Melingkar (SVG) */
        .gauge-wrapper {
            position: relative;
            margin: 6px auto 8px;
            width: 168px;
            height: 168px;
        }

        .circular-chart {
            display: block;
            width: 100%;
            height: 100%;
        }

            fill: none;
            stroke: var(--track-ring);
            stroke-width:
